<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="header">
      <h1>Create New Password</h1>
      <p>Enter your new password below.</p>
    </div>

    <div *ngIf="validating" class="validating-message">
      <div class="spinner"></div>
      <p>Validating reset link...</p>
    </div>

    <div *ngIf="!validating && !tokenValid" class="error-message">
      {{ error }}
      <div class="back-to-login" style="margin-top: 15px;">
        <a (click)="goToLogin()">← Back to Login</a>
      </div>
    </div>

    <div *ngIf="!validating && tokenValid">
      <div class="success-message" *ngIf="successMessage">
        <span class="success-icon">✓</span>
        {{ successMessage }}
        <p class="redirect-message">Redirecting to login...</p>
      </div>

      <div *ngIf="!successMessage">
        <div class="error-message" *ngIf="error">
          {{ error }}
        </div>

        <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input 
              type="password" 
              id="newPassword" 
              name="newPassword"
              [(ngModel)]="newPassword"
              required
              minlength="6"
              placeholder="Enter new password (min. 6 characters)"
              class="form-control"
              [disabled]="loading">
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
              placeholder="Confirm your new password"
              class="form-control"
              [disabled]="loading">
          </div>

          <button type="submit" class="btn-reset" [disabled]="loading">
            <span *ngIf="!loading">Reset Password</span>
            <span *ngIf="loading">Resetting...</span>
          </button>
        </form>

        <div class="back-to-login">
          <a (click)="goToLogin()">← Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
