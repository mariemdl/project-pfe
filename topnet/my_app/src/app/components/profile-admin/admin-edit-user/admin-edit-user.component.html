<div class="edit-user-container">
    <div class="edit-user-card">
        <div class="header">
            <h1>✏️ Edit User: {{ user?.username }}</h1>
            <button class="btn-back" (click)="goBack()">← Back to Users</button>
        </div>

        <div class="success-message" *ngIf="successMessage">
            {{ successMessage }}
        </div>
        <div class="error-message" *ngIf="error">
            {{ error }}
        </div>

        <form (ngSubmit)="saveUser()">
            <!-- Basic Information -->
            <div class="section-title">📋 Basic Information</div>
          
                <div class="form-group">
                    <label>Username *</label>
                    <input type="text" [(ngModel)]="editData.username" name="username" required class="form-control" [disabled]="loading" aria-label="username">
                </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" [(ngModel)]="editData.email" name="email" required class="form-control" [disabled]="loading" aria-label="email">
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" [(ngModel)]="editData.full_name" name="fullName" class="form-control" [disabled]="loading" aria-label="full name">
            </div>

            <div class="form-group">
                <label>Role</label>
                <select [(ngModel)]="editData.role" name="role" class="form-control" [disabled]="loading" aria-label="role">
                    <option value="viewer">Viewer</option>
                    <option value="operator">Operator</option>
                    <option value="manager">Manager</option>
                    <option value="profile_admin">Profile Admin</option>
                    <option value="system_admin">System Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select [(ngModel)]="editData.is_active" name="status" class="form-control" [disabled]="loading" aria-label="status">
                    <option [value]="true">Active</option>
                    <option [value]="false">Inactive</option>
                </select>
            </div>

            <!-- Password Section -->
            <div class="section-title">🔑 Change Password</div>
          
            <div class="form-group">
                <label>New Password</label>
                <input type="password" [(ngModel)]="editData.password" name="password" placeholder="Leave empty to keep current password" class="form-control" [disabled]="loading">
                <small class="hint">Leave empty to keep the current password</small>
            </div>

            <div class="form-group" *ngIf="editData.password">
                <label>Confirm Password</label>
                <input type="password" [(ngModel)]="editData.confirmPassword" name="confirmPassword" class="form-control" [disabled]="loading" aria-label="confirm password">
            </div>

            <!-- Permissions Section -->
            <div class="section-title">🔐 Permissions</div>
          
            <div class="permissions-group">
                <label *ngFor="let perm of permissions" class="perm-checkbox">
                    <input type="checkbox" [value]="perm.id" (change)="togglePermission(perm.id)" [checked]="isPermissionSelected(perm.id)" [disabled]="loading">
                    <span>
                        <strong>{{ getPermissionIcon(perm.name) }} {{ perm.name }}</strong>
                        <small>{{ perm.description }}</small>
                    </span>
                </label>
            </div>

            <!-- Manager Assignment (only for managers) -->
            <div class="manager-section" *ngIf="editData.role === 'manager'">
                <div class="section-title">👔 Assign to Manager</div>
                    <div class="form-group">
                        <label>Manager</label>
                        <select [(ngModel)]="editData.manager_id" name="managerId" class="form-control" [disabled]="loading" aria-label="manager id">
                            <option [value]="null">No manager</option>
                            <option *ngFor="let manager of availableManagers" [value]="manager.id">
                                {{ manager.full_name || manager.username }} ({{ manager.email }})
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button type="button" class="btn-secondary" (click)="goBack()" [disabled]="loading">Cancel</button>
                    <button type="submit" class="btn-primary" [disabled]="loading">
                        <span *ngIf="!loading">💾 Save Changes</span>
                        <span *ngIf="loading">Saving...</span>
                    </button>
                </div>
        </form>
    </div>
</div>
